<!doctype html>
<!-- The 1200×630 share image and the 180×180 touch icon, rendered by Playwright (redesign/NOTES.md § brand). -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
body { margin: 0; padding: 0; }
.og { width: 1200px; height: 630px; position: relative; overflow: hidden; padding: 64px 72px; box-sizing: border-box; }
.og h1 { font-size: 132px; line-height: .86; letter-spacing: -.055em; color: var(--ink); }
.og .a { color: var(--cobalt); } .og .b { font-style: italic; font-weight: 800; color: var(--oxblood); text-decoration: underline; text-decoration-color: var(--marigold); text-decoration-thickness: .09em; text-underline-offset: .04em; }
.og .both { background: var(--duo); padding: 0 .06em; }
.og img { position: absolute; left: 72px; bottom: 56px; height: 40px; }
.og .cursor { position: absolute; } .og .cursor span { font-size: 18px; }
.og .cursor svg { width: 30px; height: 30px; }
.icon { width: 180px; height: 180px; background: var(--paper); position: relative; }
.icon i { position: absolute; width: 92px; height: 92px; }
</style></head><body>
<div class="og canvas" id="og">
  <h1><span class="a">Find the</span> <span class="b">other half</span><br><span class="a">of your</span> <span class="both">company.</span></h1>
  <img src="../brand/wordmark.svg" alt="">
  <div class="cursor cursor--a" style="left:700px;top:395px"><svg viewBox="0 0 22 22"><path d="M2 1.5v17l4.6-4.4 3.1 6.6 3-1.4-3-6.4H16z" fill="currentColor" stroke="#f2e9da" stroke-width="1.4"/></svg><span>You · code</span></div>
  <div class="cursor cursor--b" style="left:900px;top:470px"><svg viewBox="0 0 22 22"><path d="M2 1.5v17l4.6-4.4 3.1 6.6 3-1.4-3-6.4H16z" fill="currentColor" stroke="#3b1726" stroke-width="1.4"/></svg><span>Co-founder · hardware</span></div>
</div>
<div class="icon" id="icon"><i style="left:22px;top:22px;background:var(--cobalt)"></i><i style="left:66px;top:66px;background:var(--marigold)"></i><i style="left:66px;top:66px;width:48px;height:48px;background:var(--duo)"></i></div>
</body></html>
